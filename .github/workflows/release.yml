name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'ci-*'
  workflow_dispatch:

jobs:
  build-windows:
    if: github.repository == 'sigpanic/goink-private'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: 'frontend/package-lock.json' }

      - name: Cache runtime deps
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: build/runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('scripts/download-git.sh', 'scripts/download-onnx.sh') }}

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install sqlite3 headers (CGo)
        shell: bash
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sqlite-amalgamation.zip" "https://www.sqlite.org/2023/sqlite-amalgamation-3440000.zip"
          unzip -qjo "$RUNNER_TEMP/sqlite-amalgamation.zip" -d "$RUNNER_TEMP/sqlite"
          echo "CGO_CFLAGS=${CGO_CFLAGS} -I${RUNNER_TEMP}/sqlite" >> $GITHUB_ENV

      - name: Download runtime deps
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash scripts/download-git.sh
          bash scripts/download-onnx.sh

      - name: Build
        shell: bash
        run: |
          cd frontend && npm ci && npm run build && cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"; fi
          wails build -tags webkit2_41 -o goink.exe -ldflags "-X internal/version.Version=$VERSION"

      - name: Install Inno Setup
        run: choco install innosetup -y --limit-output

      - name: Package (Inno Setup)
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/Inno Setup 6:$PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"; fi
          export VERSION
          iscc build/package/windows/setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist/*

  build-linux:
    if: github.repository == 'sigpanic/goink-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: 'frontend/package-lock.json' }

      - name: Cache runtime deps
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: build/runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('scripts/download-git.sh', 'scripts/download-onnx.sh') }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Download runtime deps
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: |
          bash scripts/download-git.sh
          bash scripts/download-onnx.sh

      - name: Build
        run: |
          cd frontend && npm ci && npm run build && cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"; fi
          wails build -tags webkit2_41 -o goink -ldflags "-X internal/version.Version=$VERSION"

      - name: Package (AppImage)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"; fi
          bash build/package/linux/build-appimage.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/dist/*

  build-macos:
    if: github.repository == 'sigpanic/goink-private'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: 'frontend/package-lock.json' }

      - name: Cache runtime deps
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: build/runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('scripts/download-git.sh', 'scripts/download-onnx.sh') }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Download runtime deps
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: |
          bash scripts/download-git.sh
          bash scripts/download-onnx.sh

      - name: Build
        run: |
          cd frontend && npm ci && npm run build && cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"; fi
          wails build -tags webkit2_41 -o goink -ldflags "-X internal/version.Version=$VERSION"

      - name: Package (DMG)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"; fi
          bash build/package/macos/build-dmg.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/dist/*

  release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'sigpanic/goink-private'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EULA.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4

      - name: Collect artifacts
        run: |
          mkdir dist
          cp windows/* dist/ 2>/dev/null || true
          cp linux/* dist/ 2>/dev/null || true
          cp macos/* dist/ 2>/dev/null || true
          cp EULA.md dist/
          cd dist && shopt -s nullglob && sha256sum *.{exe,AppImage,dmg} > sha256sums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.SYNC_PAT }}
          repository: sigpanic/goink
          files: dist/*
